[pytest]
testpaths = tests

# `audio` tests play a real tone through the speakers and capture it back
# through Stereo Mix. That is the point of them — the echo-suppression gate
# cannot be validated any other way — but it means every routine `pytest` run
# beeped out loud, which on a day of repeated runs is just noise in the room.
# Excluded by default; run them deliberately:
#
#   .venv/Scripts/python.exe -m pytest -m audio
#
markers =
    audio: plays sound through the real output device (opt-in, excluded by default)

addopts = -m "not audio"
